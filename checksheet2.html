<meta charset="UTF-8">

<title>地雷チェックシート2</title>
<style>
  :root{
    --teal:#8b0000;
    --teal-dark:#6b0000;
    --ink:#222222;
    --line:#333333;
    --line-soft:#d4d4d4;
    --n1:#f3d9d9;
    --n2:#e2acac;
    --n3:#cc6b6b;
    --n4:#a82626;
    --n5:#8b0000;
    --seg-empty:#ececec;
    --note-head:#f0dede;
    --bg:#f5f5f5;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:20px 14px 64px;
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1040px;margin:0 auto;}
  h1.page-title{
    font-size:22px;font-weight:700;text-align:center;margin:0 0 6px;letter-spacing:.04em;
  }
  p.page-lead{text-align:center;margin:0 0 20px;font-size:13px;color:#666666;}

  /* ---- control panel ---- */
  .panel{
    background:var(--card);border:1px solid var(--line-soft);border-radius:8px;
    padding:8px 10px;margin:0 auto 18px;max-width:1040px;
  }
  .panel-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .field{flex:1 1 200px;min-width:150px;}
  .field input{
    width:100%;border:1px solid var(--line-soft);border-radius:5px;padding:5px 8px;
    font:inherit;font-size:12px;background:#fff;color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  button.act{
    border:1px solid var(--teal-dark);background:var(--teal);color:#ffffff;font:inherit;
    font-weight:700;font-size:12px;padding:5px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;
  }
  button.act.ghost{background:#fff;color:var(--teal-dark);}
  button.act:hover{filter:brightness(1.04);}
  button.act:active{transform:translateY(1px);}
  button.act:focus-visible{outline:2px solid var(--teal-dark);outline-offset:2px;}
  .status{font-size:12px;min-height:0;color:#6b0000;}
  .status:empty{display:none;}
  .status.err{color:#a13232;}
  .viewurl{font-size:11px;word-break:break-all;}
  .viewurl:empty{display:none;}
  .viewurl a{color:var(--teal-dark);}
  .hint{font-size:10px;color:#999999;}
  .panel-meta{display:flex;flex-direction:column;gap:3px;margin-top:6px;}

  .view-banner{
    background:#fff4d6;border:1px solid #e3c766;color:#6b520f;border-radius:8px;
    padding:10px 14px;margin:0 auto 22px;max-width:1040px;font-size:13px;text-align:center;
  }

  /* ---- sheet ---- */
  .sheet{background:var(--card);border:2px solid var(--line);border-radius:2px;margin-bottom:34px;overflow:hidden;}
  .sheet-title{
    background:var(--teal);color:#ffffff;font-weight:700;font-size:17px;text-align:center;
    padding:12px 10px;letter-spacing:.06em;border-bottom:2px solid var(--line);
  }
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  th,td{border:1px solid var(--line-soft);padding:8px 10px;vertical-align:middle;font-size:13px;}
  thead th{border:1px solid var(--line);}
  .th-guide{
    background:#f0f0f0;text-align:left;font-weight:400;font-size:12px;line-height:1.45;
    color:#333333;white-space:pre-line;
  }
  .th-num{text-align:center;color:#fff;font-weight:700;font-size:12px;padding:8px 2px;}
  .th-num.n1{background:var(--n1);color:var(--ink);}
  .th-num.n2{background:var(--n2);color:var(--ink);}
  .th-num.n3{background:var(--n3);color:#fff;}
  .th-num.n4{background:var(--n4);}
  .th-num.n5{background:var(--n5);}
  .th-note{background:var(--note-head);text-align:center;font-weight:700;}
  td.item{text-align:left;}
  td.meter-cell{padding:6px 8px;}
  td.note{padding:2px 4px;}
  td.note input{width:100%;border:none;background:transparent;font:inherit;padding:6px 4px;color:var(--ink);outline:none;}
  td.note input:focus{background:#fbf2f2;}
  td.note input:disabled{color:var(--ink);opacity:1;}
  tbody tr:nth-child(even){background:#fafafa;}
  tbody tr:hover{background:#fbf2f2;}

  /* ---- meter ---- */
  .meter{display:flex;gap:3px;align-items:stretch;height:22px;}
  .meter .seg{
    flex:1 1 0;border:1px solid #c6c6c6;background:var(--seg-empty);cursor:pointer;
    padding:0;border-radius:2px;transition:background .08s;position:relative;
  }
  .meter .seg:first-child{border-top-left-radius:6px;border-bottom-left-radius:6px;}
  .meter .seg:last-child{border-top-right-radius:6px;border-bottom-right-radius:6px;}
  .meter .seg:hover{background:#dcdcdc;}
  .meter .seg:focus-visible{outline:2px solid var(--teal-dark);outline-offset:1px;z-index:1;}
  .meter .seg.on[data-level="1"]{background:var(--n1);border-color:#dcb5b5;}
  .meter .seg.on[data-level="2"]{background:var(--n2);border-color:#c98d8d;}
  .meter .seg.on[data-level="3"]{background:var(--n3);border-color:#b04f4f;}
  .meter .seg.on[data-level="4"]{background:var(--n4);border-color:#8a1c1c;}
  .meter .seg.on[data-level="5"]{background:var(--n5);border-color:#6b0000;}
  .meter .seg.on:hover{filter:brightness(1.03);}

  /* 3段メーター（チェックシート2） */
  .meter.lv3 .seg.on[data-level="1"]{background:var(--n1);border-color:#dcb5b5;}
  .meter.lv3 .seg.on[data-level="2"]{background:var(--n3);border-color:#b04f4f;}
  .meter.lv3 .seg.on[data-level="3"]{background:var(--n5);border-color:#6b0000;}
  h2.sheet-group{
    font-size:19px;font-weight:700;margin:38px 0 14px;padding:0 0 8px;
    border-bottom:2px solid var(--teal);color:var(--teal);letter-spacing:.04em;
  }
  .memo-box{
    background:var(--card);border:2px solid var(--line);border-radius:2px;
    padding:12px 14px;margin-bottom:34px;
  }
  .memo-box label{display:block;font-weight:700;font-size:14px;margin-bottom:8px;}
  .memo-box textarea{
    width:100%;min-height:120px;border:1px solid var(--line-soft);border-radius:5px;
    padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);background:#fff;resize:vertical;
  }
  .memo-box textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  body.readonly .memo-box textarea{background:#fafafa;}

  .source-note{
    text-align:right;font-size:12px;color:#666666;margin:-18px 0 34px;word-break:break-all;
  }
  body.readonly .panel{display:none;}
  body.readonly .meter .seg{cursor:default;pointer-events:none;}

  @media (max-width:640px){
    .th-guide{font-size:11px;}
    th,td{font-size:12px;padding:6px 5px;}
    .th-num{font-size:11px;}
    .meter{height:20px;}
  }
  @media (prefers-reduced-motion:reduce){
    .meter .seg{transition:none;}
    button.act:active{transform:none;}
  }
</style>

      "同卓者の自主ロスト", "シナリオ内で事前情報扱いではないがPC視点では知っているであろう情報をKPから事前に伝える(知人NPCや町のマップ等)", "極端にロスト率が上がる能力値/技能値の場合にKPからそれを助言する",
      "公開情報に書かれていない推奨技能/能力値をKPから伝える", "KP側で難易度を調整する(上げる)", "KP側で難易度を調整する(下げる)",
      "KPからRP時間を巻くよう指示する", "途中ロストからのコンティニュー", "同一シナリオの周回(2週目)",
      "2週目(動画通過含め)PLとの同卓", "未通過シナリオの継続PCとの同卓", "KPによるシーンの追加や展開の改変",
      "KPによる根本的な設定の改変", "KPによるNPC設定の改変", "KPによる他シナリオのNPCやPCを登場させる改変",
      "KPによるエンディングの改変", "KPの恩情で生かされる(序盤〜中盤)", "KPの恩情で生かされる(終盤)",
      "地雷回避のため、KPから事前にある程度シナリオの情報を渡す"
    ]
  }
];

const LS_DATA = "mcs2_data";
const LS_TOKEN = "mcs2_token";
const LS_GIST = "mcs2_gist";
const GIST_FILE = "mine_check2.json";

const STATE = { values: {}, notes: {}, memo: "" };
let READONLY = false;

function keyOf(prefix, ci, ii){ return prefix + "c" + ci + "i" + ii; }

/* ---------- build DOM ---------- */
function buildSheet(cat, ci, opt){
  opt = opt || {};
  const LV = opt.levels || 5;
  const GD = opt.guide || GUIDE2;
  const PF = opt.prefix || "";
  const sheet = document.createElement("section");
  sheet.className = "sheet";

  const title = document.createElement("div");
  title.className = "sheet-title";
  title.textContent = cat.title;
  sheet.appendChild(title);

  const table = document.createElement("table");
  const colgroup = document.createElement("colgroup");
  let cols = '<col style="width:30%">';
  for (let n = 1; n <= LV; n++) cols += '<col style="width:' + (30 / LV) + '%">';
  cols += '<col style="width:40%">';
  colgroup.innerHTML = cols;
  table.appendChild(colgroup);

  const thead = document.createElement("thead");
  const htr = document.createElement("tr");
  const guide = document.createElement("th");
  guide.className = "th-guide";
  guide.textContent = GD;
  htr.appendChild(guide);
  for (let n = 1; n <= LV; n++){
    const th = document.createElement("th");
    th.className = "th-num n" + n;
    th.textContent = String(n);
    htr.appendChild(th);
  }
  const noteHead = document.createElement("th");
  noteHead.className = "th-note";
  noteHead.textContent = "備考";
  htr.appendChild(noteHead);
  thead.appendChild(htr);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  cat.items.forEach(function(name, ii){
    const key = keyOf(PF, ci, ii);
    const tr = document.createElement("tr");

    const item = document.createElement("td");
    item.className = "item";
    item.textContent = name;
    tr.appendChild(item);

    const meterCell = document.createElement("td");
    meterCell.className = "meter-cell";
    meterCell.colSpan = LV;
    const meter = document.createElement("div");
    meter.className = "meter" + (LV === 3 ? " lv3" : "");
    meter.dataset.key = key;
    meter.setAttribute("role", "group");
    meter.setAttribute("aria-label", name + " 苦手度");
    for (let lv = 1; lv <= LV; lv++){
      const seg = document.createElement("button");
      seg.type = "button";
      seg.className = "seg";
      seg.dataset.level = String(lv);
      seg.title = "苦手度 " + lv;
      seg.setAttribute("aria-label", name + " 苦手度 " + lv);
      meter.appendChild(seg);
    }
    meterCell.appendChild(meter);
    tr.appendChild(meterCell);

    const note = document.createElement("td");
    note.className = "note";
    const input = document.createElement("input");
    input.type = "text";
    input.dataset.key = key;
    input.setAttribute("aria-label", name + " 備考");
    input.addEventListener("input", function(){
      if (READONLY) return;
      STATE.notes[key] = input.value;
    });
    note.appendChild(input);
    tr.appendChild(note);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  sheet.appendChild(table);
  return sheet;
}

function renderMeter(meterEl){
  const key = meterEl.dataset.key;
  const v = STATE.values[key] || 0;
  meterEl.querySelectorAll(".seg").forEach(function(seg){
    const lv = Number(seg.dataset.level);
    seg.classList.toggle("on", lv <= v);
    seg.setAttribute("aria-pressed", lv <= v ? "true" : "false");
  });
}

function applyState(){
  document.querySelectorAll(".meter").forEach(renderMeter);
  document.querySelectorAll("td.note input").forEach(function(input){
    input.value = STATE.notes[input.dataset.key] || "";
  });
  const memo = document.getElementById("memo2");
  if (memo) memo.value = STATE.memo || "";
}

/* ---------- interaction ---------- */
function onSegClick(e){
  if (READONLY) return;
  const seg = e.target.closest(".seg");
  if (!seg) return;
  const meter = seg.closest(".meter");
  const key = meter.dataset.key;
  const lv = Number(seg.dataset.level);
  STATE.values[key] = (STATE.values[key] === lv) ? 0 : lv; // click same level to clear
  renderMeter(meter);
}

/* ---------- persistence ---------- */
function buildPayload(){
  return {
    type: "mine_check_sheet2",
    version: 1,
    updatedAt: new Date().toISOString(),
    values: STATE.values,
    notes: STATE.notes,
    memo: STATE.memo
  };
}
function loadPayload(obj){
  STATE.values = (obj && obj.values) ? obj.values : {};
  STATE.notes = (obj && obj.notes) ? obj.notes : {};
  STATE.memo = (obj && obj.memo) ? obj.memo : "";
  applyState();
}

function setStatus(msg, isErr){
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status" + (isErr ? " err" : "");
}

function saveLocal(){
  try{
    localStorage.setItem(LS_DATA, JSON.stringify(buildPayload()));
    setStatus("この端末に保存しました。", false);
  }catch(err){
    setStatus("保存に失敗しました：" + err.message, true);
  }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_DATA);
    if (raw) loadPayload(JSON.parse(raw));
  }catch(err){ /* ignore corrupt local data */ }
}

async function gistRequest(url, method, token, body){
  const headers = { "Accept": "application/vnd.github+json" };
  if (token) headers["Authorization"] = "token " + token;
  if (body) headers["Content-Type"] = "application/json";
  const res = await fetch(url, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok){
    let detail = res.status + " " + res.statusText;
    try{ const j = await res.json(); if (j && j.message) detail = j.message; }catch(e){}
    throw new Error(detail);
  }
  return res.json();
}

async function syncGist(){
  const token = document.getElementById("token").value.trim();
  let gistId = document.getElementById("gistId").value.trim();
  if (!token){ setStatus("同期にはGitHubトークン（gistスコープ）が必要です。", true); return; }
  const files = {}; files[GIST_FILE] = { content: JSON.stringify(buildPayload(), null, 2) };
  setStatus("同期中…", false);
  try{
    let result;
    if (gistId){
      result = await gistRequest("https://api.github.com/gists/" + gistId, "PATCH", token, { files: files });
    }else{
      result = await gistRequest("https://api.github.com/gists", "POST", token,
        { description: "地雷チェックシート2", public: false, files: files });
      gistId = result.id;
      document.getElementById("gistId").value = gistId;
    }
    localStorage.setItem(LS_TOKEN, token);
    localStorage.setItem(LS_GIST, gistId);
    saveLocalSilent();
    showViewUrl(gistId);
    setStatus("同期しました。", false);
  }catch(err){
    setStatus("同期に失敗しました：" + err.message, true);
  }
}

async function loadGist(){
  const token = document.getElementById("token").value.trim();
  const gistId = document.getElementById("gistId").value.trim();
  if (!gistId){ setStatus("読み込むGist IDを入力してください。", true); return; }
  setStatus("読込中…", false);
  try{
    const result = await gistRequest("https://api.github.com/gists/" + gistId, "GET", token || null, null);
    const file = result.files && result.files[GIST_FILE];
    if (!file){ setStatus("このGistに対象データが見つかりません。", true); return; }
    loadPayload(JSON.parse(file.content));
    localStorage.setItem(LS_GIST, gistId);
    if (token) localStorage.setItem(LS_TOKEN, token);
    saveLocalSilent();
    showViewUrl(gistId);
    setStatus("Gistから読み込みました。", false);
  }catch(err){
    setStatus("読込に失敗しました：" + err.message, true);
  }
}

function saveLocalSilent(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify(buildPayload())); }catch(e){}
}

function viewUrlFor(gistId){
  return location.origin + location.pathname + "?view=" + encodeURIComponent(gistId);
}
function showViewUrl(gistId){
  const el = document.getElementById("viewUrl");
  const url = viewUrlFor(gistId);
  el.innerHTML = "";
  const label = document.createElement("span"); label.textContent = "閲覧用URL：";
  const a = document.createElement("a"); a.href = url; a.textContent = url; a.target = "_blank"; a.rel = "noopener";
  el.appendChild(label); el.appendChild(a);
}

async function copyViewUrl(){
  const gistId = document.getElementById("gistId").value.trim() || localStorage.getItem(LS_GIST);
  if (!gistId){ setStatus("先に同期して閲覧用URLを発行してください。", true); return; }
  const url = viewUrlFor(gistId);
  try{
    await navigator.clipboard.writeText(url);
    setStatus("閲覧用URLをコピーしました。", false);
  }catch(err){
    showViewUrl(gistId);
    setStatus("コピーできませんでした。上のURLを手動でコピーしてください。", true);
  }
}

/* ---------- view (read-only) mode ---------- */
async function enterViewMode(gistId){
  READONLY = true;
  document.body.classList.add("readonly");
  document.getElementById("viewBanner").style.display = "block";
  document.querySelectorAll("td.note input").forEach(function(i){ i.disabled = true; });
  const m2 = document.getElementById("memo2"); if (m2) m2.readOnly = true;
  document.querySelectorAll(".meter .seg").forEach(function(s){ s.tabIndex = -1; });
  try{
    const result = await gistRequest("https://api.github.com/gists/" + gistId, "GET", null, null);
    const file = result.files && result.files[GIST_FILE];
    if (!file){ document.getElementById("viewBanner").textContent = "閲覧用データが見つかりませんでした。"; return; }
    loadPayload(JSON.parse(file.content));
  }catch(err){
    document.getElementById("viewBanner").textContent = "閲覧用データの取得に失敗しました：" + err.message;
  }
}

/* ---------- init ---------- */
function init(){
  const container = document.getElementById("sheets");
  CATEGORIES2.forEach(function(cat, ci){
    container.appendChild(buildSheet(cat, ci, { levels: 5, guide: GUIDE2, prefix: "b" }));
  });

  const memoBox = document.createElement("div");
  memoBox.className = "memo-box";
  const lb = document.createElement("label");
  lb.setAttribute("for", "memo2");
  lb.textContent = "備考欄";
  const ta = document.createElement("textarea");
  ta.id = "memo2";
  ta.addEventListener("input", function(){
    if (READONLY) return;
    STATE.memo = ta.value;
  });
  memoBox.appendChild(lb);
  memoBox.appendChild(ta);
  container.appendChild(memoBox);

  const src = document.createElement("div");
  src.className = "source-note";
  src.textContent = "参考元：https://booth.pm/ja/items/4144089";
  container.appendChild(src);

  container.addEventListener("click", onSegClick);

  const params = new URLSearchParams(location.search);
  const view = params.get("view");
  if (view){
    enterViewMode(view);
    return;
  }

  // edit mode: restore local token/gist/data
  const savedToken = localStorage.getItem(LS_TOKEN);
  const savedGist = localStorage.getItem(LS_GIST);
  if (savedToken) document.getElementById("token").value = savedToken;
  if (savedGist){ document.getElementById("gistId").value = savedGist; showViewUrl(savedGist); }
  loadLocal();

  document.getElementById("saveBtn").addEventListener("click", saveLocal);
  document.getElementById("syncBtn").addEventListener("click", syncGist);
  document.getElementById("loadBtn").addEventListener("click", loadGist);
  document.getElementById("copyUrlBtn").addEventListener("click", copyViewUrl);
}

if (document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
}else{
  init();
}
</script>

<script>
/* ===== 共通ヘッダー（大ページ ≡メニュー / 小ページタブ） ===== */
(function(){
  var REPO   = "8i10/kp-scenario";
  var BRANCH = "main";
  var JSON_URL = "https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/profile.json";
  var HOME = "index.html";
  var EDIT = new URLSearchParams(location.search).get("edit") === "1";
  var SELF = (location.pathname.split("/").pop() || "index.html").toLowerCase();

  function withEdit(u){
    if(!EDIT) return u;
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "edit=1";
  }
  function fileOf(u){ return String(u||"").split("?")[0].split("/").pop().toLowerCase(); }
  function isSelf(u){ return !!u && fileOf(u) === SELF; }

  var menu = document.getElementById("ethNavMenu");
  var btn  = document.getElementById("ethNavBtn");
  function closeMenu(){ menu.classList.remove("open"); }
  btn.addEventListener("click", function(e){ e.stopPropagation(); menu.classList.toggle("open"); });
  document.addEventListener("click", function(e){
    var w = document.querySelector(".eth-navwrap");
    if(w && !w.contains(e.target)) closeMenu();
  });

  function majorHref(m){
    if(m.url) return withEdit(m.url);
    var ps = m.pages || [];
    if(ps.length && ps.every(function(p){ return !!p.url; })) return withEdit(ps[0].url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || ""));
  }
  function pageHref(m, p){
    if(p.url) return withEdit(p.url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || "") + "&page=" + encodeURIComponent(p.id || ""));
  }

  fetch(JSON_URL + "?t=" + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var majors = (j && Array.isArray(j.majors)) ? j.majors : [];
      var cur = null;
      majors.forEach(function(m){
        if(isSelf(m.url)) cur = m;
        (m.pages || []).forEach(function(p){ if(isSelf(p.url)) cur = m; });
      });

      menu.innerHTML = "";
      majors.forEach(function(m){
        var b = document.createElement("button");
        var here = (cur && m.id === cur.id);
        b.className = "eth-mtab" + (here ? " active" : "");
        b.textContent = m.name || "(無題)";
        b.addEventListener("click", function(){ closeMenu(); location.href = majorHref(m); });
        menu.appendChild(b);
      });

      var bar = document.getElementById("ethTabbar");
      var inner = document.getElementById("ethTabbarInner");
      inner.innerHTML = "";
      if(cur && (cur.pages || []).length > 1){
        bar.style.display = "";
        cur.pages.forEach(function(p){
          var b = document.createElement("button");
          b.className = "eth-tab" + (isSelf(p.url) ? " active" : "");
          b.textContent = p.name || "(無題)";
          b.addEventListener("click", function(){ location.href = pageHref(cur, p); });
          inner.appendChild(b);
        });
      }
    })
    .catch(function(){ /* 取得失敗時はメニュー空 */ });
})();
</script>
