<style>
  :root{
    --accent:#8b0000;
    --accent-dark:#6b0000;
    --ink:#222222;
    --line:#333333;
    --line-soft:#d4d4d4;
    --n1:#f3d9d9;
    --n2:#e2acac;
    --n3:#cc6b6b;
    --n4:#a82626;
    --n5:#8b0000;
    --seg-empty:#ececec;
    --muted:#777777;
    --bg:#f5f5f5;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:0 0 64px;background:var(--bg);color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.6;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:900px;margin:0 auto;padding:20px 14px 0;}

  /* ---- panel ---- */
  .panel{
    background:var(--card);border:1px solid var(--line-soft);border-radius:8px;
    padding:8px 10px;margin:0 0 18px;
  }
  .panel-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .field{flex:1 1 200px;min-width:150px;}
  .field input{
    width:100%;border:1px solid var(--line-soft);border-radius:5px;padding:5px 8px;
    font:inherit;font-size:12px;background:#fff;color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button.act{
    border:1px solid var(--accent-dark);background:var(--accent);color:#fff;font:inherit;
    font-weight:700;font-size:12px;padding:5px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;
  }
  button.act.ghost{background:#fff;color:var(--accent-dark);}
  button.act:hover{filter:brightness(1.06);}
  .status{font-size:12px;color:var(--accent-dark);}
  .status:empty{display:none;}
  .status.err{color:#a13232;}
  .viewurl{font-size:11px;word-break:break-all;}
  .viewurl:empty{display:none;}
  .viewurl a{color:var(--accent-dark);}
  .hint{font-size:10px;color:#999;}
  .panel-meta{display:flex;flex-direction:column;gap:3px;margin-top:6px;}

  .view-banner{
    background:#fff4d6;border:1px solid #e3c766;color:#6b520f;border-radius:8px;
    padding:10px 14px;margin:0 0 18px;font-size:13px;text-align:center;
  }

  /* ---- section ---- */
  .sec{
    background:var(--card);border:1px solid var(--line-soft);border-radius:10px;
    margin-bottom:16px;overflow:hidden;
  }
  .sec-head{
    background:var(--accent);color:#fff;font-weight:700;font-size:15px;
    padding:9px 14px;display:flex;align-items:center;gap:8px;
  }
  .sec-head .sec-title{flex:1;}
  .sec-head input.sec-title-input{
    flex:1;font:inherit;font-size:15px;font-weight:700;color:#fff;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.5);
    border-radius:5px;padding:3px 8px;
  }
  .sec-head input.sec-title-input::placeholder{color:rgba(255,255,255,.7);}
  .sec-body{padding:6px 14px 12px;}

  /* ---- item ---- */
  .item{padding:10px 0;border-bottom:1px dashed var(--line-soft);}
  .item:last-of-type{border-bottom:none;}
  .item-name{
    font-weight:700;font-size:13px;margin-bottom:6px;
    padding-left:10px;border-left:3px solid var(--accent);
  }
  .item-val{padding-left:13px;}
  /* 自由入力欄：枠線なし・自動伸縮 */
  .item-val textarea{
    width:100%;min-height:26px;border:none;background:transparent;border-radius:0;
    padding:2px 0;font:inherit;font-size:11px;color:var(--ink);
    resize:none;overflow:hidden;line-height:1.15;
  }
  .item-val textarea:focus{outline:none;border:none;background:transparent;}

  /* 自由入力欄（表示） */
  .item-text{font-size:11px;line-height:1.15;word-break:break-word;}
  .item-text p{margin:3px 0;}
  .item-text ul{margin:3px 0 3px 20px;}
  .item-text blockquote{border-left:3px solid var(--line-soft);padding-left:10px;color:var(--muted);margin:5px 0;}
  .item-text code{background:#ececec;padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px;}
  .item-text pre{background:#ececec;padding:9px;border-radius:6px;overflow-x:auto;margin:5px 0;}
  .item-text pre code{background:none;padding:0;}
  .item-text h1{font-size:17px;margin:8px 0 3px;}
  .item-text h2{font-size:15px;margin:7px 0 3px;}
  .item-text h3{font-size:12px;font-weight:700;margin:14px 0 6px;padding-left:8px;border-left:2px solid #777777;color:#000000;line-height:2.0;}
  .item-text .spoiler{background:#333;color:#333;border-radius:3px;padding:0 3px;cursor:pointer;}
  .item-text .spoiler.open{background:#ececec;color:var(--ink);}
  .item-text .note{color:var(--accent);}
  .item-text .note *{color:inherit;}
  .item-text .note .spoiler{color:#333;}
  .item-text .note .spoiler.open{color:var(--ink);}
  .item-text .blank{height:1em;margin:0;}
  .item-text .empty-val{color:#bbb;}

  /* アコーディオン記法 */
  .item-text .acc{
    background:var(--card);border:1px solid var(--line-soft);border-radius:10px;
    margin:7px 0;box-shadow:0 1px 3px rgba(0,0,0,.05);
    transition:box-shadow .18s,border-color .18s;
  }
  .item-text .acc:hover{border-color:#bdbdbd;}
  .item-text .acc.open{box-shadow:0 4px 14px rgba(0,0,0,.08);border-color:#bdbdbd;}
  .item-text .acc-head{
    display:flex;align-items:center;gap:8px;padding:10px 13px;cursor:pointer;user-select:none;
    font-weight:700;font-size:13px;color:var(--ink);
  }
  .item-text .acc-head .chev{color:var(--accent);font-size:10px;line-height:1;flex-shrink:0;transition:transform .18s ease;}
  .item-text .acc.open .acc-head .chev{transform:rotate(90deg);}
  .item-text .acc-body{display:none;padding:9px 13px 12px;border-top:1px solid var(--line-soft);font-size:11px;line-height:1.15;}
  .item-text .acc.open .acc-body{display:block;}
  .item-text .acc-body p:first-child{margin-top:0;}

  /* ---- meter（横幅いっぱい・細長い） ---- */
  .meter-wrap{width:100%;}
  .meter-labels{
    display:flex;justify-content:space-between;gap:10px;
    font-size:12px;color:var(--muted);margin-bottom:5px;line-height:1.4;
  }
  .meter-labels .right{text-align:right;}
  .meter{display:flex;gap:2px;width:100%;height:14px;}
  .meter .seg{
    flex:1 1 0;border:1px solid #c6c6c6;background:var(--seg-empty);cursor:pointer;
    padding:0;border-radius:2px;transition:background .08s;
  }
  .meter .seg:first-child{border-top-left-radius:7px;border-bottom-left-radius:7px;}
  .meter .seg:last-child{border-top-right-radius:7px;border-bottom-right-radius:7px;}
  .meter .seg:hover{background:#dcdcdc;}
  .meter .seg.on{background:var(--n5);border-color:var(--accent-dark);}
  body.readonly .meter .seg,
  body:not(.editmode) .meter .seg{cursor:default;pointer-events:none;}

  /* 記法ヒント */
  .syntax-hint{
    display:none;font-size:11px;color:var(--muted);background:#ececec;
    border-radius:6px;padding:8px 10px;margin-bottom:14px;line-height:1.6;
  }
  body.editing .syntax-hint{display:block;}

  /* ---- editor controls ---- */
  .edit-row{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
  body.editing .edit-row{display:flex;}
  .edit-row input,.edit-row select{
    border:1px solid var(--line-soft);border-radius:5px;padding:4px 7px;
    font:inherit;font-size:12px;background:#fff;color:var(--ink);
  }
  .edit-row input.nm{flex:1 1 160px;min-width:120px;}
  .edit-row input.lb{flex:1 1 110px;min-width:90px;}
  .mv{
    border:1px solid var(--line-soft);background:#fff;border-radius:5px;
    width:26px;height:26px;font-size:11px;cursor:pointer;color:var(--ink);flex:0 0 auto;
  }
  .del{
    border:1px solid var(--line-soft);background:#fff;border-radius:5px;
    padding:3px 9px;font-size:11px;cursor:pointer;color:var(--accent);flex:0 0 auto;
  }
  .add-btn{
    width:100%;background:#fff;border:1px dashed var(--line-soft);border-radius:8px;
    padding:9px;font:inherit;font-size:12px;cursor:pointer;color:var(--muted);margin-top:8px;
  }
  .add-btn:hover{background:#ececec;color:var(--ink);}
  .add-sec{margin-bottom:24px;}
  body:not(.editing) .add-btn{display:none;}
  body:not(.editing) .sec-head input.sec-title-input{display:none;}
  body.editing .sec-head .sec-title{display:none;}
  body:not(.editing) .item-name-view{display:block;}
  body.editing .item-name-view{display:none;}
  body.readonly .panel,body.readonly .add-btn,body.readonly .edit-row,
  body.readonly #editBtn{display:none;}
  body:not(.editmode) .panel{display:none;}
  body.readonly .item-val textarea{background:#fafafa;}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:26px 0;}
  .source-note{text-align:right;font-size:12px;color:#666;margin-top:6px;}

  @media (max-width:640px){
    .meter-label{flex:0 0 22%;font-size:11px;}
    .meter{height:20px;}
  }
</style>

<style>

<body>

    </div>
  </div>

  <div class="syntax-hint">
    <strong>Discord記法：</strong>
    **太字** / *斜体* / __下線__ / ~~取り消し線~~ / `コード` / ```コードブロック``` / &gt; 引用 / ||スポイラー|| / # 見出し / ## 中見出し / - リスト<br>
    行頭の <strong>※</strong> は赤字になります。<br>
    <strong>アコーディオン：</strong> <code>:::見出し</code> … <code>:::</code> で囲むと開閉カードになります。
  </div>

  <div id="sections"></div>

<script>
const LS_DATA  = "psc_data";
const LS_TOKEN = "psc_token";
const LS_GIST  = "psc_gist";
const GIST_FILE = "playstyle_check.json";

/* ---- GitHubリポジトリ保存（全端末で共有） ---- */
const GH_REPO   = "8i10/kp-scenario";
const GH_BRANCH = "main";
const GH_FILE   = "playstyle_check.json";
const GH_API    = "https://api.github.com/repos/" + GH_REPO + "/contents/" + GH_FILE;
const GH_TOKEN_KEY = "gh_token_v1";
const LEVELS = 7;
const IS_EDIT_MODE = new URLSearchParams(location.search).get("edit") === "1";

let DATA = { sections: [] };
let EDITING = false;
let READONLY = false;
function canEdit(){ return !READONLY && IS_EDIT_MODE; }

function uid(){ return "x" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }
function $(s){ return document.querySelector(s); }

/* ---------- Discord記法レンダリング ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function inline(s){
  let t = esc(s);
  t = t.replace(/```([\s\S]*?)```/g, function(m, c){ return "<pre><code>" + c.replace(/^\n/, "") + "</code></pre>"; });
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\|\|([\s\S]+?)\|\|/g, '<span class="spoiler" onclick="this.classList.toggle(\'open\')">$1</span>');
  t = t.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  t = t.replace(/__([^_\n]+)__/g, "<u>$1</u>");
  t = t.replace(/~~([^~\n]+)~~/g, "<s>$1</s>");
  t = t.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return t;
}
function toggleAcc(el){ el.parentNode.classList.toggle("open"); }

/* 行頭のインデント（半角/全角スペース・タブ）を em に換算 */
function indentEm(raw){
  const m = String(raw).match(/^[ \t\u3000]+/);
  if (!m) return 0;
  let em = 0;
  for (const ch of m[0]){
    if (ch === "\u3000") em += 1;
    else if (ch === "\t") em += 2;
    else em += 0.5;
  }
  return em;
}
function indentStyle(raw){
  const em = indentEm(raw);
  return em ? ' style="padding-left:' + em + 'em"' : "";
}


function renderMarkdown(src){
  const lines = String(src == null ? "" : src).split("\n");
  let html = "", inList = false, inCode = false, code = "";
  function closeList(){ if (inList){ html += "</ul>"; inList = false; } }
  for (let i = 0; i < lines.length; i++){
    const raw = lines[i], line = raw.trim();
    if (!inCode && /^:::\s*\S/.test(line)){
      closeList();
      const title = line.replace(/^:::\s*/, "");
      const inner = [];
      let j = i + 1, closed = false, depth = 1;
      for (; j < lines.length; j++){
        const lt = lines[j].trim();
        if (lt === ":::"){ depth--; if (depth === 0){ closed = true; break; } inner.push(lines[j]); continue; }
        if (/^:::\s*\S/.test(lt)){ depth++; inner.push(lines[j]); continue; }
        inner.push(lines[j]);
      }
      html += '<div class="acc">' +
                '<div class="acc-head" onclick="toggleAcc(this)">' +
                  '<span class="chev">▶</span><span>' + inline(title) + "</span>" +
                "</div>" +
                '<div class="acc-body">' + renderMarkdown(inner.join("\n")) + "</div>" +
              "</div>";
      i = closed ? j : lines.length;
      continue;
    }
    if (line.startsWith("```")){
      if (inCode){ html += "<pre><code>" + esc(code) + "</code></pre>"; code = ""; inCode = false; }
      else { closeList(); inCode = true; }
      continue;
    }
    if (inCode){ code += raw + "\n"; continue; }
    if (line === ""){ closeList(); html += '<p class="blank"></p>'; continue; }
    if (/^###\s+/.test(line)){ closeList(); html += "<h3>" + inline(line.replace(/^###\s+/, "")) + "</h3>"; continue; }
    if (/^##\s+/.test(line)){ closeList(); html += "<h2>" + inline(line.replace(/^##\s+/, "")) + "</h2>"; continue; }
    if (/^#\s+/.test(line)){ closeList(); html += "<h1>" + inline(line.replace(/^#\s+/, "")) + "</h1>"; continue; }
    if (/^>\s?/.test(line)){ closeList(); html += "<blockquote>" + inline(line.replace(/^>\s?/, "")) + "</blockquote>"; continue; }
    if (/^[-*]\s+/.test(line)){
      if (!inList){ html += "<ul>"; inList = true; }
      html += "<li" + indentStyle(raw) + ">" + inline(line.replace(/^[-*]\s+/, "")) + "</li>";
      continue;
    }
    closeList();
    const ind = indentStyle(raw);
    if (line.startsWith("※")) html += '<p class="note"' + ind + ">" + inline(line) + "</p>";
    else html += "<p" + ind + ">" + inline(line) + "</p>";
  }
  closeList();
  if (inCode) html += "<pre><code>" + esc(code) + "</code></pre>";
  return html;
}

function autoGrow(el){ el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

/* Tab / Shift+Tab でインデント */
function handleTab(e){
  if (e.key !== "Tab") return;
  e.preventDefault();
  const el = e.target;
  const s = el.selectionStart, t = el.selectionEnd;
  if (e.shiftKey){
    const before = el.value.slice(0, s);
    const m = before.match(/[\u3000]$|[ ]{1,2}$/);
    if (!m) return;
    const cut = m[0].length;
    el.value = el.value.slice(0, s - cut) + el.value.slice(t);
    el.selectionStart = el.selectionEnd = s - cut;
  } else {
    el.value = el.value.slice(0, s) + "\u3000" + el.value.slice(t);
    el.selectionStart = el.selectionEnd = s + 1;
  }
  el.dispatchEvent(new Event("input", { bubbles: true }));
  autoGrow(el);
}

/* ---------- 描画 ---------- */
function render(){
  const wrap = document.getElementById("sections");
  wrap.innerHTML = "";

  if (!DATA.sections.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = EDITING ? "「＋ 見出しを追加」から作成してください。" : "内容がありません。";
    wrap.appendChild(e);
    return;
  }

  DATA.sections.forEach(function(sec, si){
    const box = document.createElement("section");
    box.className = "sec";

    /* 見出し */
    const head = document.createElement("div");
    head.className = "sec-head";
    if (!EDITING && !(sec.title || "").trim()) head.style.display = "none";
    const up = mkBtn("mv", "▲", function(){ moveSec(si, -1); });
    const dn = mkBtn("mv", "▼", function(){ moveSec(si, 1); });
    up.style.display = dn.style.display = EDITING ? "" : "none";
    const titleView = document.createElement("div");
    titleView.className = "sec-title";
    titleView.textContent = sec.title || "(無題)";
    const titleInput = document.createElement("input");
    titleInput.className = "sec-title-input";
    titleInput.placeholder = "見出し";
    titleInput.value = sec.title || "";
    titleInput.addEventListener("input", function(){ sec.title = titleInput.value; });
    const delSec = mkBtn("del", "削除", function(){
      if (!confirm("この見出しを項目ごと削除しますか？")) return;
      DATA.sections.splice(si, 1); render();
    });
    delSec.style.display = EDITING ? "" : "none";
    head.appendChild(up); head.appendChild(dn);
    head.appendChild(titleView); head.appendChild(titleInput);
    head.appendChild(delSec);
    box.appendChild(head);

    /* 項目 */
    const body = document.createElement("div");
    body.className = "sec-body";
    (sec.items || []).forEach(function(it, ii){
      body.appendChild(buildItem(sec, it, si, ii));
    });
    const addItem = document.createElement("button");
    addItem.className = "add-btn";
    addItem.textContent = "＋ 項目を追加";
    addItem.addEventListener("click", function(){
      sec.items = sec.items || [];
      sec.items.push({ id: uid(), name: "", type: "text", left: "", right: "", value: "", level: 0 });
      render();
    });
    body.appendChild(addItem);
    box.appendChild(body);

    wrap.appendChild(box);
  });
}

function mkBtn(cls, label, fn){
  const b = document.createElement("button");
  b.type = "button";
  b.className = cls;
  b.textContent = label;
  b.addEventListener("click", fn);
  return b;
}

function buildItem(sec, it, si, ii){
  const row = document.createElement("div");
  row.className = "item";

  /* 編集行 */
  const ed = document.createElement("div");
  ed.className = "edit-row";
  ed.appendChild(mkBtn("mv", "▲", function(){ moveItem(sec, ii, -1); }));
  ed.appendChild(mkBtn("mv", "▼", function(){ moveItem(sec, ii, 1); }));

  const nm = document.createElement("input");
  nm.className = "nm";
  nm.placeholder = "項目名";
  nm.value = it.name || "";
  nm.addEventListener("input", function(){
    it.name = nm.value;
    nameView.textContent = it.name || "";
  });
  ed.appendChild(nm);

  const sel = document.createElement("select");
  ["text", "meter"].forEach(function(t){
    const o = document.createElement("option");
    o.value = t;
    o.textContent = (t === "text") ? "自由入力欄" : "メーター";
    sel.appendChild(o);
  });
  sel.value = it.type || "text";
  sel.addEventListener("change", function(){ it.type = sel.value; render(); });
  ed.appendChild(sel);

  if ((it.type || "text") === "meter"){
    const lf = document.createElement("input");
    lf.className = "lb";
    lf.placeholder = "左のラベル";
    lf.value = it.left || "";
    lf.addEventListener("input", function(){ it.left = lf.value; lView.textContent = it.left; });
    const rg = document.createElement("input");
    rg.className = "lb";
    rg.placeholder = "右のラベル";
    rg.value = it.right || "";
    rg.addEventListener("input", function(){ it.right = rg.value; rView.textContent = it.right; });
    ed.appendChild(lf);
    ed.appendChild(rg);
  }

  ed.appendChild(mkBtn("del", "削除", function(){
    if (!confirm("この項目を削除しますか？")) return;
    sec.items.splice(ii, 1); render();
  }));
  row.appendChild(ed);

  /* 項目名（閲覧）：未入力なら非表示 */
  const nameView = document.createElement("div");
  nameView.className = "item-name item-name-view";
  nameView.textContent = it.name || "";
  if (!EDITING && !(it.name || "").trim()) nameView.style.display = "none";
  row.appendChild(nameView);

  /* 値 */
  const val = document.createElement("div");
  val.className = "item-val";
  let lView, rView;

  if ((it.type || "text") === "meter"){
    const mw = document.createElement("div");
    mw.className = "meter-wrap";
    const labels = document.createElement("div");
    labels.className = "meter-labels";
    lView = document.createElement("div");
    lView.textContent = it.left || "";
    rView = document.createElement("div");
    rView.className = "right";
    rView.textContent = it.right || "";
    labels.appendChild(lView); labels.appendChild(rView);

    const meter = document.createElement("div");
    meter.className = "meter";
    for (let lv = 1; lv <= LEVELS; lv++){
      const seg = document.createElement("button");
      seg.type = "button";
      seg.className = "seg" + (Number(it.level) === lv ? " on" : "");
      seg.dataset.level = String(lv);
      seg.setAttribute("aria-label", (it.name || "") + " " + lv);
      seg.addEventListener("click", function(){
        if (!canEdit()) return;
        it.level = (Number(it.level) === lv) ? 0 : lv;
        meter.querySelectorAll(".seg").forEach(function(s){
          s.classList.toggle("on", Number(s.dataset.level) === Number(it.level));
        });
      });
      meter.appendChild(seg);
    }
    mw.appendChild(labels); mw.appendChild(meter);
    val.appendChild(mw);
  } else if (EDITING){
    const ta = document.createElement("textarea");
    ta.value = it.value || "";
    ta.placeholder = "自由入力";
    ta.addEventListener("input", function(){ it.value = ta.value; autoGrow(ta); });
    ta.addEventListener("keydown", handleTab);
    val.appendChild(ta);
    setTimeout(function(){ autoGrow(ta); }, 0);
  } else {
    const box = document.createElement("div");
    box.className = "item-text";
    box.innerHTML = (it.value && it.value.trim())
      ? renderMarkdown(it.value)
      : '<p class="empty-val">（未入力）</p>';
    val.appendChild(box);
  }
  row.appendChild(val);
  return row;
}

function moveSec(i, d){
  const j = i + d;
  if (j < 0 || j >= DATA.sections.length) return;
  const t = DATA.sections[i]; DATA.sections[i] = DATA.sections[j]; DATA.sections[j] = t;
  render();
}
function moveItem(sec, i, d){
  const j = i + d;
  if (j < 0 || j >= sec.items.length) return;
  const t = sec.items[i]; sec.items[i] = sec.items[j]; sec.items[j] = t;
  render();
}

/* ---------- 編集モード ---------- */
function toggleEdit(){
  EDITING = !EDITING;
  document.body.classList.toggle("editing", EDITING);
  document.getElementById("editBtn").textContent = EDITING ? "👁 プレビュー" : "✏️ 編集";
  render();
}

/* ---------- 保存 ---------- */
function buildPayload(){
  return {
    type: "playstyle_check_sheet",
    version: 1,
    updatedAt: new Date().toISOString(),
    sections: DATA.sections
  };
}
function loadPayload(obj){
  const secs = (obj && Array.isArray(obj.sections)) ? obj.sections : [];
  DATA.sections = secs.map(function(s){
    return {
      id: s.id || uid(),
      title: s.title || "",
      items: (Array.isArray(s.items) ? s.items : []).map(function(i){
        return {
          id: i.id || uid(),
          name: i.name || "",
          type: (i.type === "meter") ? "meter" : "text",
          left: i.left || "",
          right: i.right || "",
          value: i.value || "",
          level: Number(i.level) || 0
        };
      })
    };
  });
  render();
}

function setStatus(msg, isErr){
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status" + (isErr ? " err" : "");
}
function saveLocalSilent(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify(buildPayload())); }catch(e){}
}
function saveLocal(){
  try{
    localStorage.setItem(LS_DATA, JSON.stringify(buildPayload()));
    setStatus("この端末に保存しました。", false);
  }catch(err){ setStatus("保存に失敗しました：" + err.message, true); }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_DATA);
    if (raw) loadPayload(JSON.parse(raw));
  }catch(err){}
}

function ghHeaders(token){
  const hd = { "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" };
  if (token) hd["Authorization"] = "token " + token;
  return hd;
}
function ghToken(){
  const v = document.getElementById("token");
  return (v && v.value.trim()) || localStorage.getItem(GH_TOKEN_KEY) || "";
}
function decodeB64(b64){
  const bin = atob(String(b64).replace(/\n/g, ""));
  return decodeURIComponent(Array.prototype.map.call(bin, function(c){
    return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(""));
}
function encodeB64(str){ return btoa(unescape(encodeURIComponent(str))); }

/* リポジトリから読み込む（未ログインでも可） */
async function loadFromRepo(){
  const token = ghToken();
  const res = await fetch(GH_API + "?ref=" + GH_BRANCH + "&t=" + Date.now(),
    { headers: ghHeaders(token), cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  if (!j || !j.content) throw new Error("no content");
  return JSON.parse(decodeB64(j.content));
}

/* リポジトリへ保存 */
async function saveToRepo(){
  const token = ghToken();
  if (!token){
    setStatus("GitHubトークン（repo権限）を入力してください。", true);
    return;
  }
  setStatus("GitHubへ保存中…", false);
  try{
    let sha = null;
    try{
      const cur = await fetch(GH_API + "?ref=" + GH_BRANCH + "&t=" + Date.now(),
        { headers: ghHeaders(token), cache: "no-store" });
      if (cur.ok){ const cj = await cur.json(); sha = cj.sha || null; }
    }catch(e){}

    const text = JSON.stringify(buildPayload(), null, 2);
    const body = { message: "update " + GH_FILE, content: encodeB64(text), branch: GH_BRANCH };
    if (sha) body.sha = sha;

    const res = await fetch(GH_API, { method: "PUT", headers: ghHeaders(token), body: JSON.stringify(body) });
    const rj = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error("HTTP " + res.status + " " + (rj.message || ""));

    localStorage.setItem(GH_TOKEN_KEY, token);
    saveLocalSilent();
    setStatus("GitHubへ保存しました（全端末で反映されます）。", false);
  }catch(err){
    setStatus("GitHubへの保存に失敗しました：" + err.message, true);
  }
}

/* リポジトリから再読込 */
async function reloadFromRepo(){
  setStatus("読込中…", false);
  try{
    loadPayload(await loadFromRepo());
    saveLocalSilent();
    setStatus("GitHubから読み込みました。", false);
  }catch(err){
    setStatus("読込に失敗しました：" + err.message, true);
  }
}

async function gistRequest(url, method, token, body){
  const headers = { "Accept": "application/vnd.github+json" };
  if (token) headers["Authorization"] = "token " + token;
  if (body) headers["Content-Type"] = "application/json";
  const res = await fetch(url, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok){
    let detail = res.status + " " + res.statusText;
    try{ const j = await res.json(); if (j && j.message) detail = j.message; }catch(e){}
    throw new Error(detail);
  }
  return res.json();
}

async function syncGist(){
  const token = document.getElementById("token").value.trim();
  let gistId = document.getElementById("gistId").value.trim();
  if (!token){ setStatus("同期にはGitHubトークン（gistスコープ）が必要です。", true); return; }
  const files = {}; files[GIST_FILE] = { content: JSON.stringify(buildPayload(), null, 2) };
  setStatus("同期中…", false);
  try{
    let result;
    if (gistId){
      result = await gistRequest("https://api.github.com/gists/" + gistId, "PATCH", token, { files: files });
    }else{
      result = await gistRequest("https://api.github.com/gists", "POST", token,
        { description: "TRPGプレイスタイルチェックシート", public: false, files: files });
      gistId = result.id;
      document.getElementById("gistId").value = gistId;
    }
    localStorage.setItem(LS_TOKEN, token);
    localStorage.setItem(LS_GIST, gistId);
    saveLocalSilent();
    showViewUrl(gistId);
    setStatus("同期しました。", false);
  }catch(err){ setStatus("同期に失敗しました：" + err.message, true); }
}

async function loadGist(){
  const token = document.getElementById("token").value.trim();
  const gistId = document.getElementById("gistId").value.trim();
  if (!gistId){ setStatus("読み込むGist IDを入力してください。", true); return; }
  setStatus("読込中…", false);
  try{
    const result = await gistRequest("https://api.github.com/gists/" + gistId, "GET", token || null, null);
    const file = result.files && result.files[GIST_FILE];
    if (!file){ setStatus("このGistに対象データが見つかりません。", true); return; }
    loadPayload(JSON.parse(file.content));
    localStorage.setItem(LS_GIST, gistId);
    if (token) localStorage.setItem(LS_TOKEN, token);
    saveLocalSilent();
    showViewUrl(gistId);
    setStatus("Gistから読み込みました。", false);
  }catch(err){ setStatus("読込に失敗しました：" + err.message, true); }
}

function viewUrlFor(gistId){
  return location.origin + location.pathname + "?view=" + encodeURIComponent(gistId);
}
function showViewUrl(gistId){
  const el = document.getElementById("viewUrl");
  const url = viewUrlFor(gistId);
  el.innerHTML = "";
  const label = document.createElement("span"); label.textContent = "閲覧用URL：";
  const a = document.createElement("a"); a.href = url; a.textContent = url; a.target = "_blank"; a.rel = "noopener";
  el.appendChild(label); el.appendChild(a);
}
async function copyViewUrl(){
  const gistId = document.getElementById("gistId").value.trim() || localStorage.getItem(LS_GIST);
  if (!gistId){ setStatus("先に同期して閲覧用URLを発行してください。", true); return; }
  const url = viewUrlFor(gistId);
  try{
    await navigator.clipboard.writeText(url);
    setStatus("閲覧用URLをコピーしました。", false);
  }catch(err){
    showViewUrl(gistId);
    setStatus("コピーできませんでした。上のURLを手動でコピーしてください。", true);
  }
}

async function enterViewMode(gistId){
  READONLY = true;
  document.body.classList.add("readonly");
  document.getElementById("viewBanner").style.display = "block";
  try{
    const result = await gistRequest("https://api.github.com/gists/" + gistId, "GET", null, null);
    const file = result.files && result.files[GIST_FILE];
    if (!file){ document.getElementById("viewBanner").textContent = "閲覧用データが見つかりませんでした。"; return; }
    loadPayload(JSON.parse(file.content));
  }catch(err){
    document.getElementById("viewBanner").textContent = "閲覧用データの取得に失敗しました：" + err.message;
  }
}

/* ---------- init ---------- */
function init(){
  if (IS_EDIT_MODE) document.body.classList.add("editmode");
  document.getElementById("addSecBtn").addEventListener("click", function(){
    DATA.sections.push({ id: uid(), title: "", items: [] });
    render();
  });

  const params = new URLSearchParams(location.search);
  const view = params.get("view");
  if (view){ render(); enterViewMode(view); return; }

  const savedToken = localStorage.getItem(GH_TOKEN_KEY) || localStorage.getItem(LS_TOKEN);
  const savedGist = localStorage.getItem(LS_GIST);
  if (savedToken) document.getElementById("token").value = savedToken;
  if (savedGist) document.getElementById("gistId").value = savedGist;

  /* まずGitHubリポジトリから読み込み（全端末共通）。失敗時はこの端末の保存分 */
  loadFromRepo()
    .then(function(obj){ loadPayload(obj); saveLocalSilent(); })
    .catch(function(err){
      loadLocal();
      render();
      if (!DATA.sections.length){
        const b = document.getElementById("viewBanner");
        b.style.display = "block";
        b.textContent = "GitHub上のデータを読み込めませんでした（" + err.message +
          "）。編集端末で ?edit=1 を開き「GitHubへ保存」を実行してください。";
      }
    });

  document.getElementById("editBtn").addEventListener("click", toggleEdit);
  document.getElementById("saveBtn").addEventListener("click", saveLocal);
  document.getElementById("syncBtn").addEventListener("click", saveToRepo);
  document.getElementById("loadBtn").addEventListener("click", reloadFromRepo);
  document.getElementById("copyUrlBtn").addEventListener("click", copyViewUrl);
}

if (document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
}else{
  init();
}
</script>

<script>
/* ===== 共通ヘッダー（大ページ ≡メニュー / 小ページタブ） ===== */
(function(){
  var REPO   = "8i10/kp-scenario";
  var BRANCH = "main";
  var JSON_URL = "https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/profile.json";
  var HOME = "index.html";
  var EDIT = new URLSearchParams(location.search).get("edit") === "1";
  var SELF = (location.pathname.split("/").pop() || "index.html").toLowerCase();

  function withEdit(u){
    if(!EDIT) return u;
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "edit=1";
  }
  function fileOf(u){ return String(u||"").split("?")[0].split("/").pop().toLowerCase(); }
  function isSelf(u){ return !!u && fileOf(u) === SELF; }

  var menu = document.getElementById("ethNavMenu");
  var btn  = document.getElementById("ethNavBtn");
  function closeMenu(){ menu.classList.remove("open"); }
  btn.addEventListener("click", function(e){ e.stopPropagation(); menu.classList.toggle("open"); });
  document.addEventListener("click", function(e){
    var w = document.querySelector(".eth-navwrap");
    if(w && !w.contains(e.target)) closeMenu();
  });

  function majorHref(m){
    if(m.url) return withEdit(m.url);
    var ps = m.pages || [];
    if(ps.length && ps.every(function(p){ return !!p.url; })) return withEdit(ps[0].url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || ""));
  }
  function pageHref(m, p){
    if(p.url) return withEdit(p.url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || "") + "&page=" + encodeURIComponent(p.id || ""));
  }

  fetch(JSON_URL + "?t=" + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var majors = (j && Array.isArray(j.majors)) ? j.majors : [];
      var cur = null;
      majors.forEach(function(m){
        if(isSelf(m.url)) cur = m;
        (m.pages || []).forEach(function(p){ if(isSelf(p.url)) cur = m; });
      });

      menu.innerHTML = "";
      majors.forEach(function(m){
        var b = document.createElement("button");
        var here = (cur && m.id === cur.id);
        b.className = "eth-mtab" + (here ? " active" : "");
        b.textContent = m.name || "(無題)";
        b.addEventListener("click", function(){ closeMenu(); location.href = majorHref(m); });
        menu.appendChild(b);
      });

      var bar = document.getElementById("ethTabbar");
      var inner = document.getElementById("ethTabbarInner");
      inner.innerHTML = "";
      if(cur && (cur.pages || []).length > 1){
        bar.style.display = "";
        cur.pages.forEach(function(p){
          var b = document.createElement("button");
          b.className = "eth-tab" + (isSelf(p.url) ? " active" : "");
          b.textContent = p.name || "(無題)";
          b.addEventListener("click", function(){ location.href = pageHref(cur, p); });
          inner.appendChild(b);
        });
      }
    })
    .catch(function(){ /* 取得失敗時はメニュー空 */ });
})();
</script>
