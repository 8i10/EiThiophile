<style>
  :root{
    --accent:#8b0000;
    --accent-dark:#6b0000;
    --ink:#222222;
    --line:#333333;
    --line-soft:#d4d4d4;
    --bg:#f5f5f5;
    --card:#ffffff;
    --chip:#f3f3f3;
    --chip-on:#f3d9d9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:0 0 64px;background:var(--bg);color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:900px;margin:0 auto;padding:20px 14px 0;}
  h1.page-title{font-size:22px;font-weight:700;text-align:center;margin:0 0 14px;letter-spacing:.04em;}

  .defs{
    background:var(--card);border:1px solid var(--line-soft);border-radius:8px;
    padding:10px 14px;margin:0 0 18px;font-size:12px;color:#444;
  }
  .defs div{display:flex;gap:6px;}
  .defs b{white-space:nowrap;}

  /* ---- control panel ---- */
  .panel{background:var(--card);border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px;margin:0 auto 18px;}
  .panel-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .field{flex:1 1 200px;min-width:150px;}
  .field input{width:100%;border:1px solid var(--line-soft);border-radius:5px;padding:5px 8px;font:inherit;font-size:12px;background:#fff;color:var(--ink);}
  button.act{border:1px solid var(--accent-dark);background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:12px;padding:5px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;}
  button.act.ghost{background:#fff;color:var(--accent-dark);}
  .status{font-size:12px;color:#6b0000;margin-top:6px;}
  .status:empty{display:none;}
  .status.err{color:#a13232;}
  .hint{font-size:10px;color:#999;margin-top:4px;}
  body:not(.editmode) .panel{display:none;}

  /* ---- sheet ---- */
  .sheet{background:var(--card);border:2px solid var(--line);border-radius:2px;margin-bottom:28px;overflow:hidden;}
  .sheet-title{background:var(--accent);color:#fff;font-weight:700;font-size:13px;text-align:center;padding:10px;letter-spacing:.06em;border-bottom:2px solid var(--line);}
  .sub-title{background:#f0dede;font-weight:700;font-size:13px;padding:7px 12px;border-bottom:1px solid var(--line-soft);}
  .q{padding:10px 12px;border-bottom:1px solid var(--line-soft);}
  .q:last-child{border-bottom:none;}
  .q-text{font-weight:700;font-size:13px;margin-bottom:6px;}
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opt{
    display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line-soft);
    border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;user-select:none;
  }
  .opt input{margin:0;width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
  .opt.on{background:var(--chip-on);border-color:#c98d8d;font-weight:700;}
  .q input[type=text], .q textarea{
    width:100%;border:1px solid var(--line-soft);border-radius:5px;padding:6px 8px;
    font:inherit;font-size:12px;background:#fff;color:var(--ink);
  }
  .q textarea{min-height:90px;resize:vertical;}
  .source-note{text-align:right;font-size:12px;color:#666;margin:-14px 0 28px;word-break:break-all;}
  .source-note a{color:var(--accent-dark);}

  /* 閲覧時：変更不可・見た目はそのまま */
  body:not(.editmode) .opt{cursor:default;}
  body:not(.editmode) .opt input{cursor:default;opacity:1;}
  body:not(.editmode) .opt:not(.on){opacity:.55;}

<script>
const R5 = ["嬉しい","できる","応えるが能動側はできない","苦手","地雷"];
const R4 = ["嬉しい","OK","好みではない","地雷"];
const GO = ["ぜひ行きたい","希望があれば行ってもいい","ダメ"];
const RP_ITEMS = [
  "ノーマルな喘ぎ声RPは？","♡喘ぎRPは？","濁点喘ぎRPは？","オホ声RPは？",
  "淫語RPは？","お誘いRPは？","行為拒絶RPは？",
  "行為中無反応（反応がかなり薄い、全く何の感情も抱いていない）RPは？"
];

const SECTIONS = [
  { title:"エロシの前に聞きたい！", groups:[
    { items:[
      { q:"エロシをボイスセッションで行うのは？", opts:["ボイセ希望","できる","セクシーシーンのみテキストなら","無理"] },
      { q:"エロシをテキストセッションで行うのは？", opts:["テキセ希望","できる","無理"] },
      { q:"男女で恋愛関係になるのは？", opts:R5 },
      { q:"男女で性的関係を持つのは？", opts:R5 },
      { q:"男男で恋愛関係になるのは？", opts:R5 },
      { q:"男男で性的関係を持つのは？", opts:R5 },
      { q:"女女で恋愛関係になるのは？", opts:R5 },
      { q:"女女で性的関係を持つのは？", opts:R5 },
      { q:"人外と恋愛関係になるのは？", opts:R5 },
      { q:"人外と性的関係を持つのは？", opts:R5 },
      { q:"受けか攻めなら？", opts:["攻め専","攻めがやりやすい","どっちもやりたい","受けがやりやすい","受け専"] },
      { q:"能動的な相手PCは？", opts:["むしろ自分も積極的に","ありがたい","あまりに来られると怖いかも"] },
      { q:"受動的な相手PCは？", opts:["自分から行くのでOK","相手PLが積極的ならOK","PCにも能動的でいてほしい"] },
      { q:"恋愛関係に発展していない二人でエロシに行くのは？", opts:GO },
      { q:"うちよそ要素がない3PL以上のシナリオで知り合った自PCと他PCが二人でエロシに行くのは？", opts:GO },
      { q:"自分のPCが優位になるのは？", opts:["嬉しい","OK","PCによる","優位には立ちたくない"] },
      { q:"自分のPCが劣位になるのは？", opts:["嬉しい","OK","PCによる","劣位には立ちたくない"] },
      { q:"受け攻めが逆転するのは？", opts:["嬉しい","OK","PCによる","一回だけなら","地雷"] },
      { q:"受け攻めは変わらず立場逆転する（能動側）のは？", opts:["嬉しい","OK","PCによる","地雷"] },
      { q:"受け攻めは変わらず立場逆転される（受動側）のは？", opts:["嬉しい","OK","PCによる","地雷"] },
      { q:"攻めバトル（左右が決まっていない時にシナリオ内でどちらが攻めになるか競う）は？", opts:["嬉しい","やってもいい","事前に決めておきたい"] },
      { q:"セクシーシーンはどれくらいやりたい？", opts:["オリジナルの描写や展開に発展させてじっくり","地の文にセリフや行動を付け加える形でそれなりに","地の文だけで満足"] },
      { q:"喘ぎ声だけのRPはどれくらい必要？", opts:["喘ぎ声だけでもたくさん欲しい","中弛みしない程度に","意味のないセリフはいらない（言葉のみにしてほしい）"] }
    ]}
  ]},
  { title:"呼称について", groups:[
    { items:[
      { q:"男性器の呼称として好ましくないものがあれば選んでください。", opts:["ちんこ","ちんちん","ちんぽ","ペニス","怒張","昂り","男根","マラ","魔羅","陰茎","イチモツ","肉棒","おちんちん","おちんぽ","おちんぽ様","息子"] },
      { q:"女性器の呼称として好ましくないものがあれば選んでください。", opts:["まんこ","おまんこ","恥部"] },
      { q:"性行為の呼称として好ましくないものがあれば選んでください。", opts:["行為","セックス","エッチ","仲良し","交尾","子作り","性交"] },
      { q:"その他、呼称として好ましくないものがあれば書いてください。", type:"area" }
    ]}
  ]},
  { title:"セクシーシーン（濡れ場）の好みについて", groups:[
    { sub:"女性", items: RP_ITEMS.map(function(t){ return { q:"女性の" + t, opts:R4 }; }) },
    { sub:"男性", items: RP_ITEMS.map(function(t){ return { q:"男性の" + t, opts:R4 }; }) },
    { sub:"その他特別書いておきたいものがある方向け", items:
      [{ q:"対象", type:"text" }].concat(RP_ITEMS.map(function(t){ return { q:t, opts:R4 }; })) },
    { sub:"全般", items:[
      { q:"攻め喘ぎは？", opts:R4 },
      { q:"行為の擬音を描写するのは？", opts:R4 },
      { q:"行為の擬音に♡を付けるのは？", opts:R4 },
      { q:"ラブラブRPは？", opts:R4 },
      { q:"ギスギス（拒絶、行為中の暴言）RPは？", opts:R4 },
      { q:"性行為中他の誰かを匂わせるのは？", opts:R4 },
      { q:"ファンタジーすぎる性行為（簡単に届く結腸や子宮、男性器が大きすぎる、前戯なしですぐに挿入可能など）は？", opts:R4 },
      { q:"アヘ顔、ガニ股イキなどは？", opts:R4 },
      { q:"その他（相方への要望、細かい地雷など）", type:"area" }
    ]}
  ]}
];

const GH_REPO   = "8i10/EiThiophile";
const GH_BRANCH = "main";
const GH_FILE   = "erosi_check.json";
const GH_API    = "https://api.github.com/repos/" + GH_REPO + "/contents/" + GH_FILE;
const GH_RAW    = "https://raw.githubusercontent.com/" + GH_REPO + "/" + GH_BRANCH + "/" + GH_FILE;
const GH_TOKEN_KEY = "gh_token_v1";
const IS_EDIT_MODE = new URLSearchParams(location.search).get("edit") === "1";

const STATE = { checks:{}, texts:{} };

function keyOf(si, gi, qi){ return "s" + si + "g" + gi + "q" + qi; }

function build(){
  const container = document.getElementById("sheets");
  SECTIONS.forEach(function(sec, si){
    const sheet = document.createElement("section");
    sheet.className = "sheet";
    const t = document.createElement("div");
    t.className = "sheet-title";
    t.textContent = sec.title;
    sheet.appendChild(t);
    sec.groups.forEach(function(g, gi){
      if (g.sub){
        const st = document.createElement("div");
        st.className = "sub-title";
        st.textContent = g.sub;
        sheet.appendChild(st);
      }
      g.items.forEach(function(it, qi){
        const key = keyOf(si, gi, qi);
        const box = document.createElement("div");
        box.className = "q";
        const qt = document.createElement("div");
        qt.className = "q-text";
        qt.textContent = it.q;
        box.appendChild(qt);
        if (it.type === "text" || it.type === "area"){
          const el = document.createElement(it.type === "area" ? "textarea" : "input");
          if (it.type === "text") el.type = "text";
          el.dataset.key = key;
          el.disabled = !IS_EDIT_MODE;
          el.addEventListener("input", function(){ if (IS_EDIT_MODE) STATE.texts[key] = el.value; });
          box.appendChild(el);
        } else {
          const opts = document.createElement("div");
          opts.className = "opts";
          it.opts.forEach(function(o, oi){
            const lb = document.createElement("label");
            lb.className = "opt";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.dataset.key = key;
            cb.dataset.oi = String(oi);
            cb.disabled = !IS_EDIT_MODE;
            cb.addEventListener("change", function(){
              if (!IS_EDIT_MODE) return;
              const arr = (STATE.checks[key] || []).filter(function(v){ return v !== oi; });
              if (cb.checked) arr.push(oi);
              arr.sort(function(a,b){ return a-b; });
              if (arr.length) STATE.checks[key] = arr; else delete STATE.checks[key];
              lb.classList.toggle("on", cb.checked);
            });
            lb.appendChild(cb);
            lb.appendChild(document.createTextNode(o));
            opts.appendChild(lb);
          });
          box.appendChild(opts);
        }
        sheet.appendChild(box);
      });
    });
    container.appendChild(sheet);
  });
}

function applyState(){
  document.querySelectorAll(".opt input").forEach(function(cb){
    const arr = STATE.checks[cb.dataset.key] || [];
    cb.checked = arr.indexOf(Number(cb.dataset.oi)) >= 0;
    cb.parentNode.classList.toggle("on", cb.checked);
  });
  document.querySelectorAll(".q input[type=text], .q textarea").forEach(function(el){
    el.value = STATE.texts[el.dataset.key] || "";
  });
}

function loadPayload(obj){
  STATE.checks = (obj && obj.checks) ? obj.checks : {};
  STATE.texts  = (obj && obj.texts)  ? obj.texts  : {};
  applyState();
}

function setStatus(msg, isErr){
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status" + (isErr ? " err" : "");
}
function ghHeaders(token){
  const hd = { "Accept":"application/vnd.github.v3+json", "Content-Type":"application/json" };
  if (token) hd["Authorization"] = "token " + token;
  return hd;
}
function ghToken(){
  const v = document.getElementById("token");
  return (v && v.value.trim()) || localStorage.getItem(GH_TOKEN_KEY) || "";
}
function decodeB64(b64){
  const bin = atob(String(b64).replace(/\n/g, ""));
  return decodeURIComponent(Array.prototype.map.call(bin, function(c){
    return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(""));
}
function encodeB64(str){ return btoa(unescape(encodeURIComponent(str))); }

async function loadFromRepo(){
  const token = ghToken();
  if (token){
    const res = await fetch(GH_API + "?ref=" + GH_BRANCH + "&t=" + Date.now(), { headers: ghHeaders(token), cache:"no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    return JSON.parse(decodeB64(j.content));
  }
  const r = await fetch(GH_RAW + "?t=" + Date.now(), { cache:"no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return JSON.parse(await r.text());
}

async function saveToRepo(){
  const token = ghToken();
  if (!token){ setStatus("GitHubトークン（repo権限）を入力してください。", true); return; }
  setStatus("GitHubへ保存中…", false);
  try{
    let sha = null;
    try{
      const cur = await fetch(GH_API + "?ref=" + GH_BRANCH + "&t=" + Date.now(), { headers: ghHeaders(token), cache:"no-store" });
      if (cur.ok){ const cj = await cur.json(); sha = cj.sha || null; }
    }catch(e){}
    const payload = { type:"erosi_check", version:1, updatedAt:new Date().toISOString(), checks:STATE.checks, texts:STATE.texts };
    const body = { message:"update " + GH_FILE, content: encodeB64(JSON.stringify(payload, null, 2)), branch: GH_BRANCH };
    if (sha) body.sha = sha;
    const res = await fetch(GH_API, { method:"PUT", headers: ghHeaders(token), body: JSON.stringify(body) });
    const rj = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error("HTTP " + res.status + " " + (rj.message || ""));
    localStorage.setItem(GH_TOKEN_KEY, token);
    setStatus("GitHubへ保存しました。", false);
  }catch(err){
    setStatus("GitHubへの保存に失敗しました：" + err.message, true);
  }
}

async function reloadFromRepo(){
  setStatus("読込中…", false);
  try{ loadPayload(await loadFromRepo()); setStatus("GitHubから読み込みました。", false); }
  catch(err){ setStatus("読込に失敗しました：" + err.message, true); }
}

function init(){
  if (IS_EDIT_MODE) document.body.classList.add("editmode");
  build();
  const saved = localStorage.getItem(GH_TOKEN_KEY);
  if (saved) document.getElementById("token").value = saved;
  loadFromRepo().then(loadPayload).catch(function(){});
  document.getElementById("syncBtn").addEventListener("click", saveToRepo);
  document.getElementById("loadBtn").addEventListener("click", reloadFromRepo);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
<script>
/* ===== 共通ヘッダー（大ページ ≡メニュー / 小ページタブ） ===== */
(function(){
  var REPO   = "8i10/EiThiophile";
  var BRANCH = "main";
  var JSON_URL = "https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/profile.json";
  var HOME = "index.html";
  var EDIT = new URLSearchParams(location.search).get("edit") === "1";
  var SELF = (location.pathname.split("/").pop() || "index.html").toLowerCase();

  function withEdit(u){
    if(!EDIT) return u;
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "edit=1";
  }
  function fileOf(u){ return String(u||"").split("?")[0].split("/").pop().toLowerCase(); }
  function isSelf(u){ return !!u && fileOf(u) === SELF; }

  var menu = document.getElementById("ethNavMenu");
  var btn  = document.getElementById("ethNavBtn");
  function closeMenu(){ menu.classList.remove("open"); }
  btn.addEventListener("click", function(e){ e.stopPropagation(); menu.classList.toggle("open"); });
  document.addEventListener("click", function(e){
    var w = document.querySelector(".eth-navwrap");
    if(w && !w.contains(e.target)) closeMenu();
  });

  function majorHref(m){
    if(m.url) return withEdit(m.url);
    var ps = m.pages || [];
    if(ps.length && ps.every(function(p){ return !!p.url; })) return withEdit(ps[0].url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || ""));
  }
  function pageHref(m, p){
    if(p.url) return withEdit(p.url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || "") + "&page=" + encodeURIComponent(p.id || ""));
  }

  var CACHE_KEY = "eth_profile_cache_v1";
  function readCache(){
    try{ var s = localStorage.getItem(CACHE_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; }
  }
  function writeCache(j){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(j)); }catch(e){}
  }
  fetch(JSON_URL + "?t=" + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(j && Array.isArray(j.majors)) writeCache(j);
      else j = readCache();               /* 取得失敗時は前回の内容を使う */
      var majors = (j && Array.isArray(j.majors)) ? j.majors : [];
      var cur = null;
      majors.forEach(function(m){
        if(isSelf(m.url)) cur = m;
        (m.pages || []).forEach(function(p){ if(isSelf(p.url)) cur = m; });
      });

      menu.innerHTML = "";
      majors.forEach(function(m){
        if(m.hidden) return;
        var b = document.createElement("button");
        var here = (cur && m.id === cur.id);
        b.className = "eth-mtab" + (here ? " active" : "");
        b.textContent = m.name || "(無題)";
        b.addEventListener("click", function(){ closeMenu(); location.href = majorHref(m); });
        menu.appendChild(b);
      });

      var bar = document.getElementById("ethTabbar");
      var inner = document.getElementById("ethTabbarInner");
      inner.innerHTML = "";
      var _vis = (cur ? (cur.pages || []) : []).filter(function(p){ return !p.hidden; });
      if(cur && _vis.length > 1){
        bar.style.display = "";
        cur.pages.forEach(function(p){
          if(p.hidden) return;
          var b = document.createElement("button");
          b.className = "eth-tab" + (isSelf(p.url) ? " active" : "");
          b.textContent = p.name || "(無題)";
          b.addEventListener("click", function(){ location.href = pageHref(cur, p); });
          inner.appendChild(b);
        });
      }
    })
    .catch(function(){
      /* 通信自体が失敗 → 前回内容で描画 */
      var j = readCache();
      var majors = (j && Array.isArray(j.majors)) ? j.majors : [];
      if(!majors.length) return;
      var cur = null;
      majors.forEach(function(m){
        if(isSelf(m.url)) cur = m;
        (m.pages || []).forEach(function(p){ if(isSelf(p.url)) cur = m; });
      });
      menu.innerHTML = "";
      majors.forEach(function(m){
        if(m.hidden) return;
        var b = document.createElement("button");
        b.className = "eth-mtab" + ((cur && m.id === cur.id) ? " active" : "");
        b.textContent = m.name || "(無題)";
        b.addEventListener("click", function(){ closeMenu(); location.href = majorHref(m); });
        menu.appendChild(b);
      });
    });
})();
</script>
