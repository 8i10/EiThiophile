name: BOOTH画像の取得

on:
  push:
    paths:
      - owned.json
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"   # 毎日 3:17（日本時間）に取りこぼしを再取得

permissions:
  contents: write

concurrency:
  group: booth-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: BOOTHから画像URLを取得
        run: python3 .github/scripts/fetch_booth_images.py
      - name: owned_images.json を保存
        run: |
          git add owned_images.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "update owned_images.json"
          git pull --rebase
          git push
