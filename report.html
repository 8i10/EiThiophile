<style>
  :root{
    --accent:#8b0000; --accent-dark:#6b0000;
    --ink:#222222; --muted:#777777; --faint:#999999;
    --line:#e2e2e2; --line2:#d0d0d0;
    --bg:#f5f5f5; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:0 0 64px;background:var(--bg);color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:900px;margin:0 auto;padding:20px 14px 0}

  .view-banner{background:#fff4d6;border:1px solid #e3c766;color:#6b520f;border-radius:8px;
    padding:10px 14px;margin:0 0 16px;font-size:13px;text-align:center}

  /* ---- 編集パネル ---- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 16px}
  .panel-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .panel input{border:1px solid var(--line2);border-radius:5px;padding:5px 8px;font:inherit;font-size:12px;background:#fff;color:var(--ink)}
  .panel input.tk{flex:1 1 200px;min-width:150px}
  button.act{border:1px solid var(--accent-dark);background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:12px;padding:6px 12px;border-radius:5px;cursor:pointer;white-space:nowrap}
  button.act.ghost{background:#fff;color:var(--accent-dark)}
  button.act:hover{filter:brightness(1.06)}
  .status{font-size:12px;color:var(--accent-dark);margin-top:6px;min-height:1em}
  .status.err{color:#a13232}
  .hint{font-size:10px;color:#aaa;margin-top:4px}
  body:not(.editmode) .panel{display:none}
  body:not(.editmode) .add-card-btn{display:none}
  body:not(.editmode) .card-edit-btns{display:none}

  /* ---- ツールバー（フィルタ・並べ替え） ---- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
  .search-wrap{position:relative;max-width:340px;margin:0 0 14px}
  .rtabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:0}
  .rtab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:8px 14px;cursor:pointer;margin-bottom:-1px}
  .rtab:hover{color:var(--ink)}
  .rtab.on{color:var(--accent-dark);border-bottom-color:var(--accent)}
  .stat-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:20px}
  .stat-table th{background:var(--accent-dim,rgba(139,0,0,.06));color:var(--accent-dark);font-weight:700;padding:8px 12px;border:1px solid var(--line);text-align:left}
  .stat-table td{padding:8px 12px;border:1px solid var(--line)}
  .stat-table tr:nth-child(even) td{background:#faf9f9}
  .stat-table td.num{text-align:right;font-variant-numeric:tabular-nums}
  .stat-table tfoot td{font-weight:700;background:#f2eeee}
  .ho-acc{border-bottom:1px solid var(--line)}
  .ho-acc-head{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;font:inherit;font-size:14px;font-weight:700;color:var(--accent-dark);padding:11px 4px;cursor:pointer;text-align:left}
  .ho-acc-head:hover{background:#faf7f7}
  .ho-acc-head .chev{font-size:.72em;color:var(--accent);transition:transform .18s ease}
  .ho-acc.open .ho-acc-head .chev{transform:rotate(90deg)}
  .ho-acc-head .ho-count{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
  .ho-acc-body{display:none;list-style:none;margin:0;padding:0 4px 12px 22px}

<script>
const REPO="8i10/EiThiophile", BRANCH="main", FILE="report.json";
const GH_API="https://api.github.com/repos/"+REPO+"/contents/"+FILE;
const GH_RAW="https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/"+FILE;
const GH_TOKEN_KEY="gh_token_v1";
const IS_EDIT=new URLSearchParams(location.search).get("edit")==="1";
const VIEW_GIST=new URLSearchParams(location.search).get("view");

let DATA={cards:[]};
let fRole="", fStatus="", fYear="", fQuery="";
let sortMode="date-desc";
let READONLY=false;

function uid(){return "c"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

/* Dropbox共有リンク→直リンク */
function toDirectImageUrl(u){
  const s=String(u||"").trim();
  if(!s) return "";
  if(!/dropbox\.com/i.test(s)) return s;
  try{const url=new URL(s);
    if(/dl\.dropboxusercontent\.com/i.test(url.hostname))return s;
    url.searchParams.delete("dl");url.searchParams.set("raw","1");return url.toString();
  }catch(e){return s.replace(/([?&])dl=0/,"$1raw=1");}
}

function ghToken(){const v=$("#token");return (v&&v.value.trim())||localStorage.getItem(GH_TOKEN_KEY)||"";}
function ghHeaders(t){return {"Authorization":"token "+t,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"};}
function decodeB64(b64){const bin=atob(String(b64).replace(/\n/g,""));return decodeURIComponent(Array.prototype.map.call(bin,function(c){return "%"+("00"+c.charCodeAt(0).toString(16)).slice(-2);}).join(""));}
function encodeB64(str){return btoa(unescape(encodeURIComponent(str)));}

function setStatus(m,e){const el=$("#status");el.textContent=m;el.className="status"+(e?" err":"");}

/* ---- 読み込み ---- */
async function loadFromRepo(){
  const t=ghToken();
  // トークンがあれば Contents API（常に最新・キャッシュなし）を優先＝保存直後もすぐ反映
  if(t){
    try{
      const res=await fetch(GH_API+"?ref="+BRANCH+"&t="+Date.now(),{headers:ghHeaders(t),cache:"no-store"});
      if(res.ok){ const j=await res.json(); if(j&&j.content) return JSON.parse(decodeB64(j.content)); }
    }catch(e){}
  }
  // トークンなし（閲覧者）は raw（回数制限なし）
  try{
    const r=await fetch(GH_RAW+"?t="+Date.now(),{cache:"no-store"});
    if(r.ok){ return JSON.parse(await r.text()); }
  }catch(e){}
  // 最後の手段：API（未ログイン）
  const res=await fetch(GH_API+"?ref="+BRANCH+"&t="+Date.now(),{headers:ghHeaders(t),cache:"no-store"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const j=await res.json();
  if(!j||!j.content) throw new Error("no content");
  return JSON.parse(decodeB64(j.content));
}
async function loadFromGist(gid){
  const res=await fetch("https://api.github.com/gists/"+gid,{headers:{"Accept":"application/vnd.github+json"}});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const j=await res.json();
  const f=j.files&&j.files[FILE];
  if(!f) throw new Error("no file");
  return JSON.parse(f.content);
}
function normalize(o){
  const cards=(o&&Array.isArray(o.cards))?o.cards:[];
  DATA.cards=cards.map(function(c){
    c=c||{};
    const cf=(c.cf&&typeof c.cf==="object")?{c:Number(c.cf.c)||0,f:Number(c.cf.f)||0}:{c:0,f:0};
    return {id:c.id||uid(),title:c.title||"",image:c.image||"",role:c.role||"PL",
      date:c.date||"",statuses:Array.isArray(c.statuses)?c.statuses:(c.status?[c.status]:[]),
      ho:Array.isArray(c.ho)?c.ho:[],cf:cf,system:c.system||"",ed:c.ed||"",url:c.url||"",
      thoughts:c.thoughts||"",
      addedAt:Number(c.addedAt)||0};
  });
}

/* ---- 保存 ---- */
function buildPayload(){return {type:"trpg_report",version:1,updatedAt:new Date().toISOString(),cards:DATA.cards};}
async function saveToRepo(){
  const t=ghToken();
  if(!t){setStatus("GitHubトークン（repo権限）を入力してください。",true);return;}
  setStatus("GitHubへ保存中…",false);
  try{
    let sha=null, remoteCount=null;
    try{
      const cur=await fetch(GH_API+"?ref="+BRANCH+"&t="+Date.now(),{headers:ghHeaders(t),cache:"no-store"});
      if(cur.ok){const cj=await cur.json();sha=cj.sha||null;
        try{const ro=JSON.parse(decodeB64(cj.content));if(ro&&Array.isArray(ro.cards))remoteCount=ro.cards.length;}catch(e){}
      }
    }catch(e){}
    // 誤上書き防止：サーバーの方がカードが多いのに、こちらが少ない場合は確認
    if(remoteCount!=null && remoteCount > DATA.cards.length){
      const ok=confirm("サーバー上には "+remoteCount+" 件ありますが、いま表示中の "+DATA.cards.length+" 件で上書きしようとしています。\n\n先にサーバーの最新を読み込むには「キャンセル」を押し、［再読込］してください。\n\nこのまま "+DATA.cards.length+" 件で上書きしますか？");
      if(!ok){setStatus("保存を中止しました。［再読込］で最新を取得してください。",true);return;}
    }
    const text=JSON.stringify(buildPayload(),null,2);
    const body={message:"update "+FILE,content:encodeB64(text),branch:BRANCH};
    if(sha)body.sha=sha;
    let res=await fetch(GH_API,{method:"PUT",headers:ghHeaders(t),body:JSON.stringify(body),cache:"no-store"});
    if(res.status===409||res.status===422){
      const cur=await fetch(GH_API+"?ref="+BRANCH+"&t="+Date.now(),{headers:ghHeaders(t),cache:"no-store"});
      const cj=await cur.json();body.sha=cj.sha;
      res=await fetch(GH_API,{method:"PUT",headers:ghHeaders(t),body:JSON.stringify(body),cache:"no-store"});
    }
    const rj=await res.json().catch(function(){return {};});
    if(!res.ok) throw new Error("HTTP "+res.status+" "+(rj.message||""));
    localStorage.setItem(GH_TOKEN_KEY,t);
    setStatus("GitHubへ保存しました（"+DATA.cards.length+" 件）。",false);
  }catch(err){setStatus("保存に失敗しました："+err.message,true);}
}

/* ---- ステータス候補（既存から収集） ---- */
function allStatuses(){
  const set=[];
  DATA.cards.forEach(function(c){(c.statuses||[]).forEach(function(s){if(s&&set.indexOf(s)<0)set.push(s);});});
  // 「通過中」を先頭に
  const pi=set.indexOf("通過中");
  if(pi>0){ set.splice(pi,1); set.unshift("通過中"); }
  return set;
}
function isWarnStatus(s){return /死|敗|ロスト|再起不能|狂気|通過中|進行/.test(s);}

function renderStatusFilter(){
  const box=$("#statusFilter");box.innerHTML="";
  const all=document.createElement("button");all.className="chip"+(fStatus===""?" on":"");all.textContent="すべて";
  all.addEventListener("click",function(){fStatus="";renderStatusFilter();renderGallery();});
  box.appendChild(all);
  allStatuses().forEach(function(s){
    const b=document.createElement("button");b.className="chip"+(fStatus===s?" on":"");b.textContent=s;
    b.addEventListener("click",function(){fStatus=s;renderStatusFilter();renderGallery();});
    box.appendChild(b);
  });
  const cur=$("#statusAccCur");
  if(cur) cur.textContent=fStatus?("："+fStatus):"";
}

/* ---- ギャラリー描画 ---- */
function dateKey(s){
  s=String(s||"").trim();
  if(!s) return 0;
  let m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);       // 2026年7月4日 / 2026-07-04
  if(!m) m=s.match(/(\d{4})\D+(\d{1,2})/);                 // 2026年7月
  if(!m) return 0;
  const y=Number(m[1]), mo=Number(m[2]||1), da=Number(m[3]||1);
  return y*10000 + mo*100 + da;
}
function yearOf(s){
  const m=String(s||"").match(/(\d{4})/);
  return m?m[1]:"";
}
function allYears(){
  const set=[];
  DATA.cards.forEach(function(c){ const y=yearOf(c.date); if(y&&set.indexOf(y)<0)set.push(y); });
  set.sort(function(a,b){return Number(b)-Number(a);}); // 新しい年が上
  return set;
}
function sortedCards(){
  let arr=DATA.cards.slice();
  if(fRole) arr=arr.filter(function(c){return c.role===fRole;});
  if(fStatus) arr=arr.filter(function(c){return (c.statuses||[]).indexOf(fStatus)>=0;});
  if(fYear) arr=arr.filter(function(c){return yearOf(c.date)===fYear;});
  if(fQuery){ const q=fQuery.toLowerCase(); arr=arr.filter(function(c){return (c.title||"").toLowerCase().indexOf(q)>=0;}); }
  arr.sort(function(a,b){
    if(sortMode==="title") return (a.title||"").localeCompare(b.title||"","ja");
    const ka=dateKey(a.date), kb=dateKey(b.date);
    if(sortMode==="date-asc") return (ka-kb) || (a.addedAt-b.addedAt);
    return (kb-ka) || (b.addedAt-a.addedAt); // date-desc
  });
  return arr;
}
function renderYearFilter(){
  const sel=document.getElementById("yearSel");
  if(!sel) return;
  const years=allYears();
  const cur=fYear;
  sel.innerHTML='<option value="">すべて</option>'+years.map(function(y){
    return '<option value="'+y+'"'+(y===cur?" selected":"")+'>'+y+'年</option>';
  }).join("");
}
function statusTag(s){return '<span class="tag status'+(isWarnStatus(s)?" warn":"")+'">'+esc(s)+'</span>';}
function normHoKey(h){
  h=String(h||"").trim();
  // 「HO参」「HO 三」等の漢数字を算用数字へ（HO1〜HO10程度を想定）
  const kanjiMap={"〇":0,"零":0,"一":1,"壱":1,"二":2,"弐":2,"三":3,"参":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10};
  const m=/^HO\s*(.+)$/i.exec(h);
  if(m){
    const rest=m[1].trim();
    if(/^\d+$/.test(rest)) return "HO"+Number(rest);
    if(rest.length===1 && kanjiMap.hasOwnProperty(rest)) return "HO"+kanjiMap[rest];
    // 「十一」等の簡易2桁
    if(rest==="十一") return "HO11"; if(rest==="十二") return "HO12";
  }
  return h;
}
function sortHo(arr){
  arr=(arr||[]).slice();
  const num=[], other=[];
  arr.forEach(function(h){
    const m=/^HO\s*(\d+)$/i.exec((h||"").trim());
    if(m) num.push({h:h,n:Number(m[1])}); else other.push(h);
  });
  num.sort(function(a,b){return a.n-b.n;});
  return num.map(function(x){return x.h;}).concat(other);
}
function hoTag(s){return '<span class="tag ho">'+esc(s)+'</span>';}
function cfTag(cf){
  if(!cf)return "";
  if((Number(cf.c)||0)===0 && (Number(cf.f)||0)===0) return "";
  return '<span class="tag plain">'+(Number(cf.c)||0)+"c"+(Number(cf.f)||0)+"f</span>";
}
function roleBadge(r){const cls=(r==="KP"||r==="PL"||r==="KPレス")?("role-"+r):"role-other";return '<span class="badge '+cls+'">'+esc(r||"")+'</span>';}

          else if(act==="up") moveCard(realIdx,-1);

        });

    g.appendChild(card);
  });
}
function moveCard(i,d){const j=i+d;if(j<0||j>=DATA.cards.length)return;const t=DATA.cards[i];DATA.cards[i]=DATA.cards[j];DATA.cards[j]=t;refresh();}
function renderCfTab(){
  const el=document.getElementById("tabCf");
  const map={}; // year -> {c,f,n}
  DATA.cards.forEach(function(c){
    const y=yearOf(c.date)||"不明";
    if(!map[y]) map[y]={c:0,f:0,n:0};
    map[y].c += Number(c.cf&&c.cf.c)||0;
    map[y].f += Number(c.cf&&c.cf.f)||0;
    map[y].n += 1;
  });
  const years=Object.keys(map).sort(function(a,b){
    if(a==="不明") return 1; if(b==="不明") return -1;
    return Number(b)-Number(a);
  });
  let totC=0,totF=0,totN=0;
  let rows=years.map(function(y){
    const m=map[y]; totC+=m.c; totF+=m.f; totN+=m.n;
    return '<tr><td>'+esc(y==="不明"?"不明":(y+"年"))+'</td><td class="num">'+m.n+'</td><td class="num">'+m.c+'</td><td class="num">'+m.f+'</td></tr>';
  }).join("");
  el.innerHTML='<div class="stat-title">年別 CF 総数</div>'+
    '<table class="stat-table"><thead><tr><th>年</th><th>卓数</th><th>C 合計</th><th>F 合計</th></tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
    '<tfoot><tr><td>合計</td><td class="num">'+totN+'</td><td class="num">'+totC+'</td><td class="num">'+totF+'</td></tr></tfoot></table>';
}
function renderHoTab(){
  const el=document.getElementById("tabHo");

  DATA.cards.forEach(function(c){
    (c.ho||[]).forEach(function(h){
      if(!h) return;
      const key=normHoKey(h);
      if(!map[key]) map[key]=[];
      map[key].push(c.title||"（無題）");
    });
  });
  const hos=sortHo(Object.keys(map));
  if(!hos.length){ el.innerHTML='<div class="stat-title">HOまとめ</div><div class="count">HOの登録がありません。</div>'; return; }
  let blocks=hos.map(function(h){
    const list=map[h].slice().sort(function(a,b){return a.localeCompare(b,"ja");}); // 五十音順
    const items=list.map(function(t){return '<li>'+esc(t)+'</li>';}).join("");
    return '<div class="ho-acc">'+
      '<button type="button" class="ho-acc-head"><span class="chev">▶</span>'+esc(h)+'<span class="ho-count">'+list.length+'件</span></button>'+
      '<ul class="ho-acc-body">'+items+'</ul>'+
    '</div>';
  }).join("");
  el.innerHTML='<div class="stat-title">HOまとめ</div>'+blocks;

function hoOptions(){const s=[];DATA.cards.forEach(function(c){(c.ho||[]).forEach(function(v){if(v&&s.indexOf(v)<0)s.push(v);});});return s;}

/* 画像を縮小してdataURLに */
function resizeDataUrl(dataUrl,maxW,cb){
  const im=new Image();
  im.onload=function(){
    let w=im.width,h=im.height;
    if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;
    cv.getContext("2d").drawImage(im,0,0,w,h);
    try{cb(cv.toDataURL("image/jpeg",0.82));}catch(e){cb(dataUrl);}
  };
  im.onerror=function(){cb(dataUrl);};
  im.src=dataUrl;
}

  var REPO   = "8i10/kp-scenario";
  var BRANCH = "main";
  var JSON_URL = "https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/profile.json";
  var HOME = "index.html";
  var EDIT = new URLSearchParams(location.search).get("edit") === "1";
  var SELF = (location.pathname.split("/").pop() || "index.html").toLowerCase();

  function withEdit(u){
    if(!EDIT) return u;
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "edit=1";
  }
  function fileOf(u){ return String(u||"").split("?")[0].split("/").pop().toLowerCase(); }
  function isSelf(u){ return !!u && fileOf(u) === SELF; }

  var menu = document.getElementById("ethNavMenu");
  var btn  = document.getElementById("ethNavBtn");
  function closeMenu(){ menu.classList.remove("open"); }
  btn.addEventListener("click", function(e){ e.stopPropagation(); menu.classList.toggle("open"); });
  document.addEventListener("click", function(e){
    var w = document.querySelector(".eth-navwrap");
    if(w && !w.contains(e.target)) closeMenu();
  });

  function majorHref(m){
    if(m.url) return withEdit(m.url);
    var ps = m.pages || [];
    if(ps.length && ps.every(function(p){ return !!p.url; })) return withEdit(ps[0].url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || ""));
  }
  function pageHref(m, p){
    if(p.url) return withEdit(p.url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || "") + "&page=" + encodeURIComponent(p.id || ""));
  }

  fetch(JSON_URL + "?t=" + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var majors = (j && Array.isArray(j.majors)) ? j.majors : [];
      var cur = null;
      majors.forEach(function(m){
        if(isSelf(m.url)) cur = m;
        (m.pages || []).forEach(function(p){ if(isSelf(p.url)) cur = m; });
      });

      menu.innerHTML = "";
      majors.forEach(function(m){
        if(m.hidden) return;
        var b = document.createElement("button");
        var here = (cur && m.id === cur.id);
        b.className = "eth-mtab" + (here ? " active" : "");
        b.textContent = m.name || "(無題)";
        b.addEventListener("click", function(){ closeMenu(); location.href = majorHref(m); });
        menu.appendChild(b);
      });

      var bar = document.getElementById("ethTabbar");
      var inner = document.getElementById("ethTabbarInner");
      inner.innerHTML = "";
      var _vis = (cur ? (cur.pages || []) : []).filter(function(p){ return !p.hidden; });
      if(cur && _vis.length > 1){
        bar.style.display = "";
        cur.pages.forEach(function(p){
          if(p.hidden) return;
          var b = document.createElement("button");
          b.className = "eth-tab" + (isSelf(p.url) ? " active" : "");
          b.textContent = p.name || "(無題)";
          b.addEventListener("click", function(){ location.href = pageHref(cur, p); });
          inner.appendChild(b);
        });
      }
    })
    .catch(function(){ /* 取得失敗時はメニュー空 */ });
})();
</script>
</body>
</html>
